/* ================= 以下、処理部分（通常は編集不要） ================= */

/* BASE組み込み版：ページ側の見出しを使うため、タイトル書き込みは行わない */


function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  return lines.map(line => {
    const row = [];
    let insideQuote = false, cell = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (insideQuote && line[i+1] === '"') { cell += '"'; i++; }
        else { insideQuote = !insideQuote; }
      } else if (c === ',' && !insideQuote) {
        row.push(cell.trim()); cell = '';
      } else {
        cell += c;
      }
    }
    row.push(cell.trim());
    return row;
  });
}

// ドキュメント側のスタイルシートを、取り込み先ブロックの中だけに効くよう書き換える
// （ブロックごとにスコープを分けるので、複数ドキュメントでもスタイルが衝突しません）
function scopeCss(cssText, scope) {
  const imports = [];
  const css = cssText.replace(/@import[^;]+;/g, m => { imports.push(m); return ''; });
  const rules = css.split('}').map(r => r.trim()).filter(Boolean).map(rule => {
    const i = rule.indexOf('{');
    if (i < 0) return '';
    const selectors = rule.slice(0, i).split(',').map(s => s.trim())
      .filter(s => s && !/^(html|body|:root)/.test(s));
    if (!selectors.length) return '';
    return selectors.map(s => scope + ' ' + s).join(',') + '{' + rule.slice(i + 1) + '}';
  }).filter(Boolean).join('\n');
  return imports.join('\n') + '\n' + rules;
}

// ドキュメント内の画像は Google 側の埋め込み制限で直接表示できないため、
// fetch で取得し直して blob URL に差し替える
function fixDocImages(div) {
  div.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (!/^https:\/\/docs\.google\.com\//.test(src)) return;
    fetch(src).then(r => { if (!r.ok) throw new Error('img'); return r.blob(); })
      .then(b => { img.src = URL.createObjectURL(b); })
      .catch(() => {});
  });
}

async function renderDoc(block, section, index) {
  if (!block.url) throw new Error('URL未設定');
  let url = block.url;
  if (/\/pub$/.test(url)) url += '?embedded=true';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Doc取得エラー');
  const parsed = new DOMParser().parseFromString(await res.text(), 'text/html');
  const contents = parsed.querySelector('#contents') || parsed.querySelector('.doc-content');
  if (!contents) throw new Error('Doc解析エラー');
  if (!contents.textContent.trim()) throw new Error('内容なし'); // 空の文書は欄ごと出さない
  const scopeClass = 'gdoc-' + index;
  let css = '';
  parsed.querySelectorAll('style').forEach(s => { css += s.textContent + '\n'; });
  const styleEl = document.createElement('style');
  styleEl.textContent = scopeCss(css, '.' + scopeClass);
  document.head.appendChild(styleEl);
  const div = document.createElement('div');
  div.className = 'gdoc ' + scopeClass;
  div.innerHTML = contents.innerHTML;
  div.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  fixDocImages(div);
  section.appendChild(div);
}

async function fetchSheetRows(block) {
  if (!block.url) throw new Error('URL未設定');
  let url = block.url;
  if (/\/pub$/.test(url)) url += '?output=csv';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Sheet取得エラー');
  return parseCSV(await res.text());
}

  const rows = await fetchSheetRows(block);

  const [head, ...body] = rows;
  const html = '<div class="table-wrap"><table class="sheet"><thead><tr>' +
    head.map(c => '<th>' + escapeHtml(c) + '</th>').join('') +
    '</tr></thead><tbody>' +
    body.map(r => '<tr>' + head.map((_, i) => '<td>' + escapeHtml(r[i] || '') + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
  section.insertAdjacentHTML('beforeend', html);
}

// 先頭行が「品名」「価格」のような見出し行だった場合は自動で読み飛ばす
// （編集する人が見出し行を足してしまっても壊れないようにするため）
function dropHeader(rows, colWords) {
  if (!rows.length) return rows;
  const first = rows[0].map(c => (c || '').trim());
  const looksHeader = colWords.some((words, i) => words.includes(first[i]));
  return looksHeader ? rows.slice(1) : rows;
}

// 日付セルの読み取り（2026/12/5、2026-12-05、12/5 に対応。読めなければ null）
function parseDateCell(s) {
  if (!s) return null;
  const str = String(s);
  let m = str.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = str.match(/(\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return new Date(new Date().getFullYear(), +m[1] - 1, +m[2]);
  return null;
}

function renderHero(block, section) {
  if (!block.image && !block.title) throw new Error('ヒーロー未設定');
  let badge = '';
  const d = parseDateCell(block.date);
  if (d) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 86400000);
    if (diff > 0) badge = '<span class="hero-badge">公開まであと' + diff + '日</span>';
    else if (diff === 0) badge = '<span class="hero-badge">本日公開！</span>';
  }
  section.innerHTML =
    (block.image ? '<img class="hero-img" src="' + escapeHtml(toImageUrl(block.image)) + '" alt="">' : '') +
    '<div class="hero-text">' +
    (block.catch ? '<div class="hero-catch">' + escapeHtml(block.catch) + '</div>' : '') +
    '<div class="hero-title">' + escapeHtml(block.title || '') + '</div>' +
    (block.dateLabel ? '<div class="hero-date">' + escapeHtml(block.dateLabel) + '</div>' : '') +
    badge + '</div>';
}

  if (!rows.length) throw new Error('データなし');
  const items = rows.map(r => ({ r, d: parseDateCell(r[0]) }))
    .sort((a, b) => (b.d || 0) - (a.d || 0)); // 新しい順
  section.insertAdjacentHTML('beforeend', items.map(({ r, d }) => {
    const dateText = d ? d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') : (r[0] || '');
    const head = escapeHtml(r[1]);
    return '<div class="news-item"><span class="news-date">' + escapeHtml(dateText) + '</span><span>' +
      (r[2] ? '<a href="' + escapeHtml(r[2]) + '" target="_blank" rel="noopener">' + head + '</a>' : head) +
      '</span></div>';
  }).join(''));
}

// 緊急バナー：ドキュメントに書けば表示され、空にすれば消える（操作はお知らせと全く同じ）
async function renderAlert(block, section, index) {
  if (!block.url) throw new Error('URL未設定');
  let url = block.url;
  if (/\/pub$/.test(url)) url += '?embedded=true';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Doc取得エラー');
  const parsed = new DOMParser().parseFromString(await res.text(), 'text/html');
  const contents = parsed.querySelector('#contents') || parsed.querySelector('.doc-content');
  if (!contents) throw new Error('Doc解析エラー');
  if (!contents.textContent.trim()) throw new Error('内容なし');
  const scopeClass = 'gdoc-alert-' + index;
  let css = '';
  parsed.querySelectorAll('style').forEach(s => { css += s.textContent + '\n'; });
  const styleEl = document.createElement('style');
  styleEl.textContent = scopeCss(css, '.' + scopeClass);
  document.head.appendChild(styleEl);
  const div = document.createElement('div');
  div.className = 'gdoc ' + scopeClass;
  div.innerHTML = contents.innerHTML;
  div.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  fixDocImages(div);
  section.appendChild(div);
}

async function renderSheetEvents(block, section) {
  const rows = dropHeader(await fetchSheetRows(block),
    [['日付', '開催日'], ['イベント名', 'タイトル', 'ライブ名']]).filter(r => r[0] || r[1]);
  if (!rows.length) throw new Error('データなし');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const items = rows.map(r => ({ r, d: parseDateCell(r[0]) }))
    .filter(x => !x.d || x.d >= today) // 終わったライブは自動で消す
    .sort((a, b) => (a.d ? a.d.getTime() : Infinity) - (b.d ? b.d.getTime() : Infinity));
  if (!items.length) {
    section.insertAdjacentHTML('beforeend',
      '<div class="scr-none">現在予定されているライブはありません。決まり次第お知らせします。</div>');
    return;
  }
  const W = ['日', '月', '火', '水', '木', '金', '土'];
  const rowHtml = ({ r, d }) => {
    const isToday = d && d.getTime() === today.getTime();
    const dateText = d ? (d.getMonth() + 1) + '月' + d.getDate() + '日（' + W[d.getDay()] + '）' : r[0];
    const meta = [r[3], r[4]].filter(Boolean).map(escapeHtml).join('　／　');
    return '<div class="evt-row' + (isToday ? ' today' : '') + '">' +
      '<div class="evt-date">' + escapeHtml(dateText) + (isToday ? '<span class="h-badge">本日</span>' : '') + '</div>' +
      '<div class="evt-body"><div class="evt-title">' + escapeHtml(r[1] || '') + '</div>' +
      (r[2] ? '<div class="evt-acts">' + escapeHtml(r[2]) + '</div>' : '') +
      (meta ? '<div class="evt-meta">' + meta + '</div>' : '') +
      (r[5] ? '<div class="evt-note">' + escapeHtml(r[5]) + '</div>' : '') + '</div></div>';
  };
  const monthLabel = d => d ? d.getFullYear() + '年' + (d.getMonth() + 1) + '月' : '日付未定';
  const groupedHtml = list => {
    let html = '', last = null;
    list.forEach(x => {
      const label = monthLabel(x.d);
      if (label !== last) { html += '<div class="evt-month">' + label + '</div>'; last = label; }
      html += rowHtml(x);
    });
    return html;
  };
  const INITIAL = 10; // 最初に表示する件数（残りは「もっと見る」で開く）
  const head = items.slice(0, INITIAL), tail = items.slice(INITIAL);
  let html = groupedHtml(head);
  if (tail.length) {
    html += '<div class="evt-tail" hidden>' + groupedHtml(tail) + '</div>' +
      '<button type="button" class="evt-more-btn">もっと見る（残り' + tail.length + '件）</button>';
  }
  section.insertAdjacentHTML('beforeend', html);
  const btn = section.querySelector('.evt-more-btn');
  if (btn) btn.addEventListener('click', () => {
    section.querySelector('.evt-tail').hidden = false;
    btn.remove();
  });
}

const RENDERERS = {
  'doc': renderDoc, 'alert': renderAlert, 'sheet-table': renderSheetTable, 'sheet-list': renderSheetList,
  'sheet-menu': renderSheetMenu, 'sheet-hours': renderSheetHours, 'sheet-gallery': renderSheetGallery,
  'map': renderMap, 'links': renderLinks, 'sheet-links': renderSheetLinks,
  'hero': renderHero, 'youtube': renderYoutube,
  'sheet-screenings': renderSheetScreenings, 'sheet-credits': renderSheetCredits,
  'sheet-quotes': renderSheetQuotes, 'sheet-news': renderSheetNews,
  'sheet-events': renderSheetEvents
};

async function loadBlocks() {
  const main = document.getElementById('sdg-blocks');
  for (let i = 0; i < CONFIG.blocks.length; i++) {
    const block = CONFIG.blocks[i];
    if (!RENDERERS[block.type]) continue;
    const section = document.createElement('section');
    if (block.type === 'hero') {
      section.className = 'hero-block'; // ヒーローはカード見出しなしで大きく出す
    } else if (block.type === 'alert') {
      section.className = 'alert-block'; // 緊急バナーも見出しなし
    } else {
      section.className = 'block';
      section.innerHTML = '<h2>' + escapeHtml(block.title || '') + '</h2><div class="loading">読み込み中...</div>';
    }
    main.appendChild(section);
    try {
      await RENDERERS[block.type](block, section, i);
      section.querySelector('.loading')?.remove();
    } catch (err) {
      console.error('ブロック読み込みエラー:', block.title, err);
      section.remove(); // 取得に失敗したブロックは表示しない
    }
  }
}

loadBlocks();
</script>
