<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>groove｜沖縄・浦添市勢理客のライブハウス</title>
<style>
/* ===== テーマ（ここの変数を変えると見た目が変わります） ===== */
:root{
  --accent:#ffb340;        /* アクセントカラー */
  --ink:#ece9e2;           /* 文字色 */
  --muted:#9aa3ab;         /* 補足テキスト色 */
  --line:#343a41;          /* 罫線色 */
  --paper:#131518;         /* 背景色 */
  --card:#1d2025;          /* カード背景 */
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
header{background:#fff;border-bottom:4px solid var(--accent);padding:26px max(18px,calc((100% - 960px)/2))}
header .site-title{font-size:clamp(24px,5vw,36px);font-weight:900;margin:0}
header .site-sub{color:var(--muted);font-size:13px;margin-top:4px}
main{max-width:960px;margin:22px auto;padding:0 14px 40px;display:grid;gap:16px}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.block>h2{font-size:18px;margin:0 0 10px;color:var(--accent)}
.block .loading{color:var(--muted);font-size:13px}
/* ドキュメント取り込み部（Google側のスタイルはJSでこの中だけに閉じ込めます） */
.gdoc{overflow-x:auto}
.gdoc .doc-content{padding:0!important;max-width:none!important}
/* ドキュメント本文は Doc 側の色に関わらず読みやすい色に固定する */
.gdoc, .gdoc p, .gdoc span, .gdoc li, .gdoc td, .gdoc th,
.gdoc h1, .gdoc h2, .gdoc h3, .gdoc h4, .gdoc h5, .gdoc h6 { color: #ece9e2 !important; }
.gdoc a { color: #ffb59d !important; text-decoration: underline; }
.gdoc img{max-width:100%;height:auto}
/* 表ブロック（列が多い表はカード内で横スクロール） */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.sheet{border-collapse:collapse;width:100%;font-size:14px}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.sheet th{background:#f0f8fa;font-weight:800}
/* リストブロック */
.list-item{padding:10px 2px;border-bottom:1px solid #e8ecee}
.list-item:last-child{border-bottom:0}
.list-item .li-title{font-weight:800}
.list-item .li-body{font-size:13px;color:#59646b;margin-top:2px;white-space:pre-wrap}
/* メニューブロック（点線リーダー＋価格右寄せ） */
.menu-item{display:flex;align-items:baseline;gap:8px;padding:7px 2px}
.menu-item .m-name{font-weight:700}
.menu-item .m-dots{flex:1;border-bottom:2px dotted #c3ccd1;transform:translateY(-3px)}
.menu-item .m-price{font-weight:800;color:var(--accent);white-space:nowrap}
.menu-desc{font-size:12px;color:#59646b;padding:0 2px 7px}
/* 営業時間ブロック */
.hours-row{display:flex;flex-wrap:wrap;gap:4px 12px;padding:7px 8px;border-bottom:1px solid #e8ecee;font-size:14px}
.hours-row:last-child{border-bottom:0}
.hours-row .h-day{font-weight:800;min-width:3.2em}
.hours-row .h-note{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.hours-row.today{background:#fdf6e3;border-radius:6px}
.h-badge{background:#e99b35;color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:2px}
/* ギャラリーブロック */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.gallery figcaption{font-size:12px;color:#59646b;margin-top:4px;text-align:center}
/* 地図ブロック */
.map-frame{width:100%;height:320px;border:0;border-radius:8px}
.map-address{font-size:14px;margin-top:8px}
.map-note{font-size:12px;color:var(--muted)}
/* 緊急バナー（ドキュメント連動。空なら出ない） */
.alert-block{background:#b91c1c;color:#fff;border-radius:var(--radius);padding:16px 20px;font-weight:700}
.alert-block .gdoc,.alert-block .gdoc *{color:#fff!important}
/* リンクボタンブロック */
.link-btns{display:flex;gap:10px;flex-wrap:wrap}

/* リンクボタン：狭い画面では縦積みにして回り込みやすく */
.link-btn{overflow-wrap:anywhere}
@media (max-width:560px){.link-btns{flex-direction:column;align-items:stretch}.link-btn{text-align:center}}

.link-btn{display:inline-block;padding:11px 22px;border-radius:24px;background:var(--accent);color:#241a05;font-weight:800;font-size:16px;text-decoration:none}
.link-btn:hover{opacity:.88}
/* ===== 映画サイト向け ===== */
/* ヒーロー（ポスター＋タイトル） */
.hero-block{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.hero-img{width:min(300px,80%);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hero-catch{color:var(--accent);font-weight:800}
.hero-title{font-size:clamp(28px,6vw,44px);font-weight:900;line-height:1.25}
.hero-date{font-weight:800;margin-top:6px}
.hero-badge{display:inline-block;background:#e99b35;color:#fff;font-weight:800;border-radius:14px;padding:3px 14px;margin-top:10px;font-size:13px}
@media(min-width:700px){.hero-block{flex-direction:row;text-align:left}.hero-img{width:260px;flex-shrink:0}}
/* 予告編（クリックで読み込む） */
.yt-facade{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}
.yt-facade img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt-facade iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:48px;background:#ff0000;border-radius:12px}
.yt-play:after{content:'';position:absolute;top:50%;left:50%;transform:translate(-40%,-50%);border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
/* 上映情報 */
.scr-row{display:flex;flex-wrap:wrap;gap:4px 14px;padding:9px 8px;border-bottom:1px solid #e8ecee;font-size:14px;align-items:baseline}
.scr-row.today{background:#fdf6e3;border-radius:6px}
.scr-date{font-weight:800;color:var(--accent);min-width:8.5em}
.scr-venue{font-weight:700}
.scr-note{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.scr-none{color:var(--muted);font-size:14px;padding:6px 2px}
/* キャスト＆スタッフ */
.credit-item{padding:10px 2px;border-bottom:1px solid #e8ecee}
.credit-item:last-child{border-bottom:0}
.cr-name{font-size:17px;font-weight:900}
.cr-role{color:var(--accent);font-weight:700;font-size:13px;margin-left:10px}
.cr-profile{font-size:13px;color:#59646b;margin-top:3px;white-space:pre-wrap}
/* 推薦コメント */
.quote-item{margin:0 0 14px;padding:14px 16px;background:#f0f8fa;border-left:4px solid var(--accent);border-radius:0 8px 8px 0}
.quote-item:last-child{margin-bottom:0}
.quote-item p{margin:0;font-size:15px;font-weight:700}
.quote-item cite{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--muted);text-align:right}
/* ライブハウスのイベント日程 */
.evt-row{display:flex;gap:14px;padding:12px 8px;border-bottom:1px solid #e8ecee}
.evt-row:last-child{border-bottom:0}
.evt-row.today{background:#fdf6e3;border-radius:6px}
.evt-date{font-weight:900;color:var(--accent);min-width:7.5em;font-size:14px}
.evt-title{font-weight:900;font-size:16px}
.evt-acts{font-size:14px;margin-top:2px}
.evt-meta{font-size:12px;color:var(--muted);margin-top:3px}
.evt-note{font-size:12px;color:#59646b;margin-top:2px}
.evt-month{font-weight:900;font-size:15px;margin:18px 8px 2px}
.evt-tail[hidden]{display:none}
.evt-more-btn{display:block;margin:14px auto 6px;padding:9px 28px;border-radius:24px;border:1.5px solid var(--accent);background:none;color:var(--accent);font-weight:800;font-size:14px;cursor:pointer}
.evt-link-btn{display:inline-block;margin-top:9px;padding:8px 20px;border-radius:20px;background:var(--accent);color:#241a05;font-weight:800;font-size:14px;text-decoration:none}


.evt-archive-btn{margin-top:22px}
.evt-archive{margin-top:4px}


/* スケジュール：読みやすさ調整（特に時間と料金を大きく太く） */
.evt-row{padding:15px 8px}
.evt-date{font-size:15px;line-height:1.45}
.evt-title{font-size:17px;line-height:1.45}
.evt-acts{font-size:15px;line-height:1.55;margin-top:3px}
.evt-time{font-size:15px;font-weight:800;color:var(--ink);margin-top:6px}
.evt-price{font-size:16px;font-weight:900;color:var(--accent);margin-top:2px}
.evt-note{font-size:13px;line-height:1.55;margin-top:4px}
.evt-month{font-size:16px}
.evt-note{color:#a8b2ba}
@media (max-width:560px){.evt-row{flex-direction:column;gap:3px}.evt-date{min-width:0}}

/* スケジュール：赤文字を黒背景で読みやすい金色に */
.evt-date{color:#ffb340}
.evt-price{color:#ffb340}
.evt-more-btn{border-color:#ffb340;color:#ffb340}
.h-badge{background:#ffb340;color:#241a05}

/* ニュース */
.news-item{display:flex;gap:12px;padding:8px 2px;border-bottom:1px solid #e8ecee;font-size:14px}
.news-item:last-child{border-bottom:0}
.news-date{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.news-item a{color:var(--ink);font-weight:700}
/* ライブハウス向けサンプル：ダークテーマ調整 */
header{background:#191c20}
.evt-row{border-bottom-color:#33383f}
.evt-row.today{background:#3a3010}
table.sheet th{background:#2a2e35}
footer{max-width:960px;margin:0 auto;padding:0 18px 30px;color:var(--muted);font-size:12px}

/*ヘッダイメージ*/
#headIMG img{ width:100%; }
</style>
</head>
<body>
<header>
  <h1 class="site-title" id="siteTitle"></h1>
  <div class="site-sub" id="siteSub"></div>
</header>
  <div id="headIMG"><img src="https://basefile.akamaized.net/grooveline/63a84fb276090/noisebord1.jpg" alt="Live House groove"></div>
<main id="blocks"></main>
<footer>groove（浦添市勢理客）— スケジュール・お知らせは Google スプレッドシート／ドキュメントと連動しています。</footer>

<script>
/* ================================================================
   設定はここだけ。Google側で「ウェブに公開」したURLを貼ってください。
   url が空のブロックは表示されません。ブロックは配列の順に並びます。
   ================================================================ */
const CONFIG = {
  siteTitle: 'groove',
  siteSub: '沖縄・浦添市勢理客のライブハウス',
  blocks: [
    { type: 'alert', url: 'https://docs.google.com/document/d/e/2PACX-1vTo7dcGKkqUZnS-4YCBWKqz8XRzw-D2S0UJf8q8Zecm8d6w7vMJ3Nz_taKuY_JGdMkyAtOdAV-AHvs2/pub' },
    { type: 'doc', title: 'News', url: 'https://docs.google.com/document/d/e/2PACX-1vQbTMZsawzJP961ZSZWeevbM3nHgX8V5xYWLDWMswuzzINi1Iqx2epOSbaKbMTFJh4Zu1VBwt4UosS2/pub' },
    { type: 'sheet-events', title: 'SCHEDULE', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTOEU9Gr72YqKaiuVQuWb-46kiLM-s2lI_IXDRhA25O1mb6MXsbNjMbISduVOWHBl6b-35o6yQZe-ti/pub?output=csv' },
    { type: 'map', title: 'アクセス', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTlszLj2jDIiU88IpwPn97m9zNW7s0A3LKBCqF4VfgFlb_AWsaMR3WWfj6XD0ZI8idnIWhKwqoguMD/pub?output=csv', address: 'groove 沖縄県浦添市勢理客2-18-10 松本ビル' },
    { type: 'doc', title: '駐車場のお知らせ', url: 'https://docs.google.com/document/d/e/2PACX-1vRRiwLi_v-_dAG7BgEB29MkpKwkvjP2_Zh_z3fEQf0NhNgiQiZr9LsakLPAiOKzWE9lPjVxttCytPQd/pub' },
    { type: 'doc', title: 'booking', url: 'https://docs.google.com/document/d/e/2PACX-1vSgf6eGeaSZ-tOpE37_MiAbjnirEwWla8IiJA6edVWdHAxw7T_JNzsm4gGGOXn7gDrDpYo-ucD0pZiG/pub' },
    { type: 'doc', title: 'フリーペーパー「ちかちゃん」', url: 'https://docs.google.com/document/d/e/2PACX-1vQ-IidPgtuiywG13qYfuzCwP-K7jWZ7PiN5V3ZybOJmLstjNJEEMXIJrYr5J98QmvMnwDz43lZneRjK/pub' },
    { type: 'sheet-links', title: 'お問い合わせ・SNS', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSz2v2ru1HqvGTHOKdjE_s8HSwx8JieOd9TiZFc8Unu1BAwRjlK2CCZdeTHSgiE6U9MukUpUm-1JJ-X/pub?output=csv' }
  ]
};

/* ================= 以下、処理部分（通常は編集不要） ================= */

document.getElementById('siteTitle').textContent = CONFIG.siteTitle;
document.getElementById('siteSub').textContent = CONFIG.siteSub;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  return lines.map(line => {
    const row = [];
    let insideQuote = false, cell = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (insideQuote && line[i+1] === '"') { cell += '"'; i++; }
        else { insideQuote = !insideQuote; }
      } else if (c === ',' && !insideQuote) {
        row.push(cell.trim()); cell = '';
      } else {
        cell += c;
      }
    }
    row.push(cell.trim());
    return row;
  });
}

// ドキュメント側のスタイルシートを、取り込み先ブロックの中だけに効くよう書き換える
// （ブロックごとにスコープを分けるので、複数ドキュメントでもスタイルが衝突しません）
function scopeCss(cssText, scope) {
  const imports = [];
  const css = cssText.replace(/@import[^;]+;/g, m => { imports.push(m); return ''; });
  const rules = css.split('}').map(r => r.trim()).filter(Boolean).map(rule => {
    const i = rule.indexOf('{');
    if (i < 0) return '';
    const selectors = rule.slice(0, i).split(',').map(s => s.trim())
      .filter(s => s && !/^(html|body|:root)/.test(s));
    if (!selectors.length) return '';
    return selectors.map(s => scope + ' ' + s).join(',') + '{' + rule.slice(i + 1) + '}';
  }).filter(Boolean).join('\n');
  return imports.join('\n') + '\n' + rules;
}

// ドキュメント内の画像は Google 側の埋め込み制限で直接表示できないため、
// fetch で取得し直して blob URL に差し替える
async function fetchImageBlob(url, tries) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url);
      if (r.ok) { const b = await r.blob(); if (!b.type || b.type.indexOf('image/') === 0) return b; }
    } catch (e) { /* 少し待って再試行する */ }
    if (i < tries - 1) await new Promise(res => setTimeout(res, 600 * (i + 1)));
  }
  return null;
}
async function fixDocImages(div) {
  const jobs = [];
  div.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (!/^https:\/\/docs\.google\.com\//.test(src)) return;
    jobs.push((async () => {
      const b = await fetchImageBlob(src, 3);
      if (b) { img.src = URL.createObjectURL(b); return; }
      setTimeout(async () => {
        const retry = await fetchImageBlob(src, 2);
        if (retry) img.src = URL.createObjectURL(retry);
        else img.style.display = 'none'; // 取得できない画像は壊れたアイコンを残さない
      }, 2500);
    })());
  });
  await Promise.all(jobs);
}

async function renderDoc(block, section, index) {
  if (!block.url) throw new Error('URL未設定');
  let url = block.url;
  if (/\/pub$/.test(url)) url += '?embedded=true';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Doc取得エラー');
  const parsed = new DOMParser().parseFromString(await res.text(), 'text/html');
  const contents = parsed.querySelector('#contents') || parsed.querySelector('.doc-content');
  if (!contents) throw new Error('Doc解析エラー');
  if (!contents.textContent.trim()) throw new Error('内容なし'); // 空の文書は欄ごと出さない
  const scopeClass = 'gdoc-' + index;
  let css = '';
  parsed.querySelectorAll('style').forEach(s => { css += s.textContent + '\n'; });
  const styleEl = document.createElement('style');
  styleEl.textContent = scopeCss(css, '.' + scopeClass);
  document.head.appendChild(styleEl);
  const div = document.createElement('div');
  div.className = 'gdoc ' + scopeClass;
  div.innerHTML = contents.innerHTML;
  div.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  fixDocImages(div);
  section.appendChild(div);
}

async function fetchSheetRows(block) {
  if (!block.url) throw new Error('URL未設定');
  let url = block.url;
  if (/\/pub$/.test(url)) url += '?output=csv';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Sheet取得エラー');
  return parseCSV(await res.text());
}

async function renderSheetTable(block, section) {
  const rows = await fetchSheetRows(block);
  if (!rows.length) throw new Error('データなし');
  const [head, ...body] = rows;
  const html = '<div class="table-wrap"><table class="sheet"><thead><tr>' +
    head.map(c => '<th>' + escapeHtml(c) + '</th>').join('') +
    '</tr></thead><tbody>' +
    body.map(r => '<tr>' + head.map((_, i) => '<td>' + escapeHtml(r[i] || '') + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
  section.insertAdjacentHTML('beforeend', html);
}

async function renderSheetList(block, section) {
  const rows = await fetchSheetRows(block);
  const items = rows.filter(r => r[0]);
  if (!items.length) throw new Error('データなし');
  section.insertAdjacentHTML('beforeend', items.map(r =>
    '<div class="list-item"><div class="li-title">' + escapeHtml(r[0]) + '</div>' +
    (r[1] ? '<div class="li-body">' + escapeHtml(r[1]) + '</div>' : '') + '</div>'
  ).join(''));
}

/* ===== 店舗向けブロック ===== */

// 先頭行が「品名」「価格」のような見出し行だった場合は自動で読み飛ばす
// （編集する人が見出し行を足してしまっても壊れないようにするため）
function dropHeader(rows, colWords) {
  if (!rows.length) return rows;
  const first = rows[0].map(c => (c || '').trim());
  const looksHeader = colWords.some((words, i) => words.includes(first[i]));
  return looksHeader ? rows.slice(1) : rows;
}

async function renderSheetMenu(block, section) {
  const rows = dropHeader(await fetchSheetRows(block),
    [['品名', 'メニュー', '商品名', '名前'], ['価格', '料金', '値段']]).filter(r => r[0]);
  if (!rows.length) throw new Error('データなし');
  section.insertAdjacentHTML('beforeend', rows.map(r =>
    '<div class="menu-item"><span class="m-name">' + escapeHtml(r[0]) + '</span>' +
    '<span class="m-dots"></span><span class="m-price">' + escapeHtml(r[1] || '') + '</span></div>' +
    (r[2] ? '<div class="menu-desc">' + escapeHtml(r[2]) + '</div>' : '')
  ).join(''));
}

async function renderSheetHours(block, section) {
  const rows = dropHeader(await fetchSheetRows(block),
    [['曜日'], ['営業時間', '時間']]).filter(r => r[0]);
  if (!rows.length) throw new Error('データなし');
  const today = ['日', '月', '火', '水', '木', '金', '土'][new Date().getDay()];
  section.insertAdjacentHTML('beforeend', rows.map(r => {
    const isToday = (r[0] || '').trim().charAt(0) === today;
    return '<div class="hours-row' + (isToday ? ' today' : '') + '">' +
      '<span class="h-day">' + escapeHtml(r[0]) + (isToday ? '<span class="h-badge">本日</span>' : '') + '</span>' +
      '<span>' + escapeHtml(r[1] || '') + '</span>' +
      (r[2] ? '<span class="h-note">' + escapeHtml(r[2]) + '</span>' : '') + '</div>';
  }).join(''));
}

function toImageUrl(u) {
  const m = String(u).match(/drive\.google\.com\/file\/d\/([^/]+)/) || String(u).match(/[?&]id=([\w-]{20,})/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1000' : u;
}

async function renderSheetGallery(block, section) {

/* ===== 映画サイト向けブロック ===== */

// 日付セルの読み取り（2026/12/5、2026-12-05、12/5 に対応。読めなければ null）
function parseDateCell(s) {
  if (!s) return null;
  const str = String(s);
  let m = str.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = str.match(/(\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return new Date(new Date().getFullYear(), +m[1] - 1, +m[2]);
  return null;
}

function renderHero(block, section) {
  if (!block.image && !block.title) throw new Error('ヒーロー未設定');
  let badge = '';
  const d = parseDateCell(block.date);
  if (d) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 86400000);
    if (diff > 0) badge = '<span class="hero-badge">公開まであと' + diff + '日</span>';
    else if (diff === 0) badge = '<span class="hero-badge">本日公開！</span>';
  }
  section.innerHTML =
    (block.image ? '<img class="hero-img" src="' + escapeHtml(toImageUrl(block.image)) + '" alt="">' : '') +
    '<div class="hero-text">' +
    (block.catch ? '<div class="hero-catch">' + escapeHtml(block.catch) + '</div>' : '') +
    '<div class="hero-title">' + escapeHtml(block.title || '') + '</div>' +
    (block.dateLabel ? '<div class="hero-date">' + escapeHtml(block.dateLabel) + '</div>' : '') +
    badge + '</div>';
}

function renderYoutube(block, section) {
  const src = String(block.videoId || block.url || '');
  const m = src.match(/(?:v=|youtu\.be\/|\/shorts\/|\/embed\/)([\w-]{6,})/);
  const id = m ? m[1] : src.trim();
  if (!id) throw new Error('動画ID未設定');
  const div = document.createElement('div');
  div.className = 'yt-facade';
  div.innerHTML = '<img src="https://i.ytimg.com/vi/' + escapeHtml(id) + '/hqdefault.jpg" alt="予告編"><span class="yt-play"></span>';
  div.addEventListener('click', () => {
    div.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + escapeHtml(id) +
      '?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  });
  section.appendChild(div);
}

async function renderSheetScreenings(block, section) {
  const rows = dropHeader(await fetchSheetRows(block),
    [['日付', '上映日'], ['劇場', '会場', '上映館']]).filter(r => r[0]);
  if (!rows.length) throw new Error('データなし');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const items = rows.map(r => ({ r, d: parseDateCell(r[0]) }))
    .filter(x => !x.d || x.d >= today) // 終わった上映は自動で消す（日付が読めない行は告知として残す）
    .sort((a, b) => (a.d ? a.d.getTime() : Infinity) - (b.d ? b.d.getTime() : Infinity)); // 日付なし行は末尾
  if (!items.length) {
    section.insertAdjacentHTML('beforeend',
      '<div class="scr-none">上映は終了しました。新しい上映情報は決まり次第お知らせします。</div>');
    return;
  }
  const W = ['日', '月', '火', '水', '木', '金', '土'];
  section.insertAdjacentHTML('beforeend', items.map(({ r, d }) => {
    const isToday = d && d.getTime() === today.getTime();
    const dateText = d ? (d.getMonth() + 1) + '月' + d.getDate() + '日（' + W[d.getDay()] + '）' : r[0];
    return '<div class="scr-row' + (isToday ? ' today' : '') + '">' +
      '<span class="scr-date">' + escapeHtml(dateText) + (isToday ? '<span class="h-badge">本日</span>' : '') + '</span>' +
      '<span class="scr-venue">' + escapeHtml(r[1] || '') + '</span>' +
      '<span class="scr-time">' + escapeHtml(r[2] || '') + '</span>' +
      (r[3] ? '<span class="scr-note">' + escapeHtml(r[3]) + '</span>' : '') + '</div>';
  }).join(''));
}

async function renderSheetNews(block, section) {
  const rows = dropHeader(await fetchSheetRows(block),
    [['日付'], ['見出し', 'タイトル', 'お知らせ']]).filter(r => r[1]);
  if (!rows.length) throw new Error('データなし');
  const items = rows.map(r => ({ r, d: parseDateCell(r[0]) }))
    .sort((a, b) => (b.d || 0) - (a.d || 0)); // 新しい順
  section.insertAdjacentHTML('beforeend', items.map(({ r, d }) => {
    const dateText = d ? d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') : (r[0] || '');
    const head = escapeHtml(r[1]);
    return '<div class="news-item"><span class="news-date">' + escapeHtml(dateText) + '</span><span>' +
      (r[2] ? '<a href="' + escapeHtml(r[2]) + '" target="_blank" rel="noopener">' + head + '</a>' : head) +
      '</span></div>';
  }).join(''));
}

// 緊急バナー：ドキュメントに書けば表示され、空にすれば消える（操作はお知らせと全く同じ）
async function renderAlert(block, section, index) {
  if (!block.url) throw new Error('URL未設定');
  let url = block.url;
  if (/\/pub$/.test(url)) url += '?embedded=true';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Doc取得エラー');
  const parsed = new DOMParser().parseFromString(await res.text(), 'text/html');
  const contents = parsed.querySelector('#contents') || parsed.querySelector('.doc-content');
  if (!contents) throw new Error('Doc解析エラー');
  if (!contents.textContent.trim()) throw new Error('内容なし');
  const scopeClass = 'gdoc-alert-' + index;
  let css = '';
  parsed.querySelectorAll('style').forEach(s => { css += s.textContent + '\n'; });
  const styleEl = document.createElement('style');
  styleEl.textContent = scopeCss(css, '.' + scopeClass);
  document.head.appendChild(styleEl);
  const div = document.createElement('div');
  div.className = 'gdoc ' + scopeClass;
  div.innerHTML = contents.innerHTML;
  div.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  fixDocImages(div);
  section.appendChild(div);
}

async function renderSheetEvents(block, section) {
  const rows = dropHeader(await fetchSheetRows(block),
    [['日付', '開催日'], ['イベント名', 'タイトル', 'ライブ名']]).filter(r => r[0] || r[1]);
  if (!rows.length) throw new Error('データなし');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const all = rows.map(r => ({ r, d: parseDateCell(r[0]) }));
  const items = all.filter(x => !x.d || x.d >= today) // 終わったライブは予定欄には出さない
    .sort((a, b) => (a.d ? a.d.getTime() : Infinity) - (b.d ? b.d.getTime() : Infinity));
  const past = all.filter(x => x.d && x.d < today)
    .sort((a, b) => b.d.getTime() - a.d.getTime()); // 過去分は新しい順に並べる
  const W = ['日', '月', '火', '水', '木', '金', '土'];
  const rowHtml = ({ r, d }, isPast) => {
    const isToday = d && d.getTime() === today.getTime();
    const dateText = d ? (d.getMonth() + 1) + '月' + d.getDate() + '日（' + W[d.getDay()] + '）' : r[0];
    return '<div class="evt-row' + (isToday ? ' today' : '') + '">' +
      '<div class="evt-date">' + escapeHtml(dateText) + (isToday ? '<span class="h-badge">本日</span>' : '') + '</div>' +
      '<div class="evt-body"><div class="evt-title">' + escapeHtml(r[1] || '') + '</div>' +
      (r[2] ? '<div class="evt-acts">' + escapeHtml(r[2]) + '</div>' : '') +
      (r[3] ? '<div class="evt-time">' + escapeHtml(r[3]) + '</div>' : '') +
      (r[4] ? '<div class="evt-price">' + escapeHtml(r[4]) + '</div>' : '') +
      (r[5] ? '<div class="evt-note">' + escapeHtml(r[5]) + '</div>' : '') +
      (r[6] && /^https?:\/\//.test(r[6].trim()) ? '<a class="evt-link-btn" href="' + escapeHtml(r[6].trim()) + '" target="_blank" rel="noopener">詳しく見る</a>' : '') + '</div></div>';
  };
  const monthLabel = d => d ? d.getFullYear() + '年' + (d.getMonth() + 1) + '月' : '日付未定';
  const groupedHtml = (list, isPast) => {
    let html = '', last = null;
    list.forEach(x => {
      const label = monthLabel(x.d);
      if (label !== last) { html += '<div class="evt-month">' + label + '</div>'; last = label; }
      html += rowHtml(x, isPast);
    });
    return html;
  };
  const INITIAL = 10; // 最初に表示する件数（残りは「もっと見る」で開く）
  let html = '';
  if (items.length) {
    const head = items.slice(0, INITIAL), tail = items.slice(INITIAL);
    html += groupedHtml(head);
    if (tail.length) {
      html += '<div class="evt-tail" hidden>' + groupedHtml(tail) + '</div>' +
        '<button type="button" class="evt-more-btn">もっと見る（残り' + tail.length + '件）</button>';
    }
  } else {
    html += '<div class="scr-none">現在予定されているライブはありません。決まり次第お知らせします。</div>';
  }
  if (past.length) {
    const PAST_INITIAL = 20; // 過去分は最初に20件、残りは「もっと見る」で遡る
    const pHead = past.slice(0, PAST_INITIAL), pTail = past.slice(PAST_INITIAL);
    html += '<button type="button" class="evt-more-btn evt-archive-btn">過去のライブを見る（全' + past.length + '件）</button>' +
      '<div class="evt-archive" hidden>' + groupedHtml(pHead, true);
    if (pTail.length) {
      html += '<div class="evt-tail" hidden>' + groupedHtml(pTail, true) + '</div>' +
        '<button type="button" class="evt-more-btn">もっと見る（残り' + pTail.length + '件）</button>';
    }
    html += '</div>';
  }
  section.insertAdjacentHTML('beforeend', html);
  section.querySelectorAll('.evt-more-btn').forEach(btn => {
    if (btn.classList.contains('evt-archive-btn')) {
      btn.addEventListener('click', () => {
        const box = btn.nextElementSibling;
        box.hidden = !box.hidden;
        btn.textContent = box.hidden ? '過去のライブを見る（全' + past.length + '件）' : '過去のライブを閉じる';
      });
    } else {
      btn.addEventListener('click', () => {
        btn.previousElementSibling.hidden = false;
        btn.remove();
      });
    }
  });
}

const RENDERERS = {
  'doc': renderDoc, 'alert': renderAlert, 'sheet-table': renderSheetTable, 'sheet-list': renderSheetList,
  'sheet-menu': renderSheetMenu, 'sheet-hours': renderSheetHours, 'sheet-gallery': renderSheetGallery,
  'map': renderMap, 'links': renderLinks, 'sheet-links': renderSheetLinks,
  'hero': renderHero, 'youtube': renderYoutube,
  'sheet-screenings': renderSheetScreenings, 'sheet-credits': renderSheetCredits,
  'sheet-quotes': renderSheetQuotes, 'sheet-news': renderSheetNews,
  'sheet-events': renderSheetEvents
};

async function loadBlocks() {
  const main = document.getElementById('blocks');
  for (let i = 0; i < CONFIG.blocks.length; i++) {
    const block = CONFIG.blocks[i];
    if (!RENDERERS[block.type]) continue;
    const section = document.createElement('section');
    if (block.type === 'hero') {
      section.className = 'hero-block'; // ヒーローはカード見出しなしで大きく出す
    } else if (block.type === 'alert') {
      section.className = 'alert-block'; // 緊急バナーも見出しなし
    } else {
      section.className = 'block';
      section.innerHTML = '<h2>' + escapeHtml(block.title || '') + '</h2><div class="loading">読み込み中...</div>';
    }
    main.appendChild(section);
    try {
      await RENDERERS[block.type](block, section, i);
      section.querySelector('.loading')?.remove();
    } catch (err) {
      console.error('ブロック読み込みエラー:', block.title, err);
      section.remove(); // 取得に失敗したブロックは表示しない
    }
  }
}

loadBlocks();
